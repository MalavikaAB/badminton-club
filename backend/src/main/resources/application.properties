spring.application.name=club-night-backend
server.port=8080
spring.config.import=optional:file:./.env[.properties]

# Supabase PostgreSQL connection. Set SUPABASE_DB_PASSWORD before starting the app.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:session-schema.sql
spring.sql.init.data-locations=classpath:demo-data.sql

# Spring Boot drops ResponseStatusException reasons from the JSON error body by
# default (include-message=never), so every refusal below - "That player is not
# on a court", "Replacement must be waiting and not sitting out", "Replacement
# does not match this court's format" - surfaced to the board as a bare 400 with
# no explanation. Send the reason so organisers can see why a swap was refused.
server.error.include-message=always
